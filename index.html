<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEX HACKER APK MANAGER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#00ff9d;--c:#00e5ff;--p:#b06bff;--p2:#ff3b9e;--txt:#eaf8f2;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Share Tech Mono',monospace;color:var(--txt);background:#000;overflow:hidden;line-height:1.5;height:100vh;height:100dvh;position:fixed;inset:0;-webkit-font-smoothing:antialiased}
#bgLayer{position:fixed;inset:0;z-index:-10;background-image:url('background.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;background-color:#050a08;filter:brightness(1.18) saturate(1.3)}
#bgLayer::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,rgba(0,255,157,.06),transparent 55%),radial-gradient(circle at 80% 90%,rgba(176,107,255,.08),transparent 55%),linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.15));pointer-events:none}
#matrix{position:fixed;inset:0;z-index:-3;opacity:.035;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.02) 0 1px,transparent 1px 3px);opacity:.05}
.app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:2;padding-top:var(--safe-top);background:transparent}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(180deg,rgba(0,12,7,.55),rgba(0,10,6,.35));backdrop-filter:blur(28px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.06);z-index:10;flex:none;position:relative;box-shadow:0 6px 32px rgba(0,0,0,.4)}
.topbar::after{content:"";position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--g) 30%,var(--c) 50%,var(--p) 70%,transparent);background-size:200% 100%;animation:slide 4s linear infinite;opacity:.7}
@keyframes slide{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tb-logo{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 0deg,#00ff9d,#00e5ff,#b06bff,#ff3b9e,#00ff9d);padding:2px;animation:spin 8s linear infinite;box-shadow:0 0 24px rgba(0,255,157,.45);cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
.tb-logo-inner{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(0,20,12,.98),rgba(0,8,4,.98));display:grid;place-items:center;animation:spin 8s linear infinite reverse}
.tb-logo-inner svg{width:20px;height:20px;fill:var(--g);filter:drop-shadow(0 0 6px var(--g))}
.tb-info{flex:1;min-width:0}
.tb-title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:13.5px;letter-spacing:1.6px;color:var(--g);text-shadow:0 0 12px rgba(0,255,157,.9),0 0 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:10px;letter-spacing:1px;color:#b8e0c8;display:flex;align-items:center;gap:6px;margin-top:2px;text-shadow:0 1px 3px #000}
.stat-dot{width:8px;height:8px;border-radius:50%;background:#ff0055;animation:pulse 1.6s infinite;flex:none;box-shadow:0 0 10px #ff0055}
.stat-dot.on{background:var(--g);box-shadow:0 0 12px var(--g)}
@keyframes pulse{50%{opacity:.4;transform:scale(1.4)}}
#clk{font-size:10px;color:var(--g);letter-spacing:1px;text-shadow:0 0 6px var(--g),0 0 3px #000}
.top-actions{display:flex;gap:8px}
.top-act-btn{width:40px;height:40px;border-radius:50%;background:rgba(0,35,18,.55);backdrop-filter:blur(20px);border:1px solid rgba(0,255,157,.28);display:grid;place-items:center;cursor:pointer;color:var(--g);font-size:16px;transition:all .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 4px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.top-act-btn:active{transform:scale(.88);background:rgba(0,255,157,.22)}
.top-act-btn svg{width:16px;height:16px;fill:var(--g)}
.top-act-btn.spin svg{animation:spin 1s linear infinite}
.app-container{flex:1;overflow-y:auto;padding:16px 14px 24px;position:relative;-webkit-overflow-scrolling:touch;background:transparent}
.app-container::-webkit-scrollbar{width:3px}
.app-container::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--g),var(--c));border-radius:2px}
.stats-bar{display:flex;gap:10px;padding:12px 14px;background:linear-gradient(135deg,rgba(0,25,14,.55),rgba(0,15,8,.35));backdrop-filter:blur(28px);border-radius:18px;border:1px solid rgba(255,255,255,.08);margin-bottom:16px;flex-wrap:wrap;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.stats-bar .stat-item{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,255,255,.04);border-radius:12px;border:1px solid rgba(255,255,255,.06);flex:1;min-width:0;position:relative;overflow:hidden}
.stats-bar .stat-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--g),transparent);border-radius:2px}
.stats-bar .stat-item svg{width:16px;height:16px;fill:var(--g);filter:drop-shadow(0 0 4px var(--g));flex:none}
.stats-bar .stat-item .lbl{font-size:9.5px;color:#8fc8a8;letter-spacing:1.2px;text-transform:uppercase}
.stats-bar .stat-item b{font-family:'Orbitron';font-weight:900;font-size:14px;color:var(--g);text-shadow:0 0 10px var(--g);margin-left:auto}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:20px 14px;padding:8px 4px}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;animation:iconIn .5s cubic-bezier(.2,.8,.2,1) backwards;user-select:none}
@keyframes iconIn{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.app-icon:active{transform:scale(.9)}
.icon-box{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(10,30,20,.55),rgba(0,15,8,.7));backdrop-filter:blur(24px);border:1.5px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12),0 0 24px rgba(0,255,157,.08);position:relative;overflow:hidden}
.icon-box img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;display:block}
.icon-box .apk-ico{width:56px;height:56px;position:relative;z-index:1}
.icon-box .apk-ico svg{width:100%;height:100%;fill:var(--g);filter:drop-shadow(0 0 12px rgba(0,255,157,.9))}
.icon-box .emoji-ico{font-size:42px;position:relative;z-index:1}
.icon-vbadge{position:absolute;top:5px;right:5px;font-family:'Orbitron';font-weight:900;font-size:8px;padding:3px 7px;border-radius:7px;background:linear-gradient(135deg,#b06bff,#ff3b9e);color:#fff;z-index:3;box-shadow:0 3px 10px rgba(176,107,255,.6)}
.icon-star{position:absolute;top:5px;left:5px;font-size:11px;color:#ffcc33;z-index:3;filter:drop-shadow(0 0 6px #ffcc33)}
.icon-name{font-family:'Orbitron';font-weight:900;font-size:12px;color:#f0fff8;text-align:center;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 6px rgba(0,255,157,.5),0 1px 4px #000;letter-spacing:.5px}
.empty{margin:auto;text-align:center;padding:60px 20px;color:#7ac090}
.empty svg{width:80px;height:80px;fill:rgba(0,255,157,.25);margin-bottom:16px}
.empty .l1{color:var(--g);font-family:'Orbitron';font-weight:900;font-size:14px;letter-spacing:2.5px;margin-bottom:8px}
.detail-view{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,12,8,.88),rgba(0,6,3,.92));backdrop-filter:blur(36px);z-index:15;display:none;flex-direction:column;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);overflow-y:auto}
.detail-view.show{display:flex;animation:detailIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes detailIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.detail-header{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;background:linear-gradient(180deg,rgba(0,18,11,.85),rgba(0,10,6,.7));backdrop-filter:blur(24px);z-index:5;border-bottom:1px solid rgba(255,255,255,.06)}
.back-btn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;cursor:pointer;flex:none}
.back-btn:active{transform:scale(.9);background:rgba(0,255,157,.18)}
.back-btn svg{width:22px;height:22px;fill:var(--g)}
.detail-title{font-family:'Orbitron';font-weight:900;font-size:14px;color:var(--g);text-shadow:0 0 14px var(--g),0 0 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;letter-spacing:1.5px}
.detail-body{padding:24px 18px;display:flex;flex-direction:column;gap:18px}
.detail-hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.detail-icon-wrap{width:140px;height:140px;border-radius:34px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(10,35,22,.6),rgba(0,15,8,.75));backdrop-filter:blur(28px);border:2px solid rgba(255,255,255,.16);box-shadow:0 16px 48px rgba(0,0,0,.65),0 0 40px rgba(0,255,157,.22);position:relative;overflow:hidden}
.detail-icon-wrap img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.detail-icon-wrap .apk-ico{width:88px;height:88px;position:relative;z-index:1}
.detail-icon-wrap .apk-ico svg{width:100%;height:100%;fill:var(--g);filter:drop-shadow(0 0 18px rgba(0,255,157,.9))}
.detail-icon-wrap .emoji-ico{font-size:68px;position:relative;z-index:1}
.detail-name{font-family:'Orbitron';font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 18px rgba(0,255,157,.9),0 3px 8px #000;word-break:break-word;letter-spacing:1px}
.detail-vbadge{display:inline-block;font-family:'Orbitron';font-weight:900;font-size:11px;padding:6px 16px;border-radius:22px;background:linear-gradient(135deg,#b06bff,#ff3b9e);color:#fff;box-shadow:0 6px 20px rgba(176,107,255,.55)}
.detail-desc{padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(0,229,255,.05));border:1px solid rgba(0,229,255,.28);font-size:12.5px;line-height:1.75;color:#d8f0ff;word-break:break-word;font-family:'Noto Sans Bengali',sans-serif}
.detail-desc .lbl{display:block;font-family:'Share Tech Mono',monospace;font-weight:700;color:var(--c);font-size:10px;margin-bottom:8px;letter-spacing:2px;text-shadow:0 0 8px var(--c)}
.link-btns{display:flex;flex-direction:column;gap:10px}
.link-btn{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;text-decoration:none;background:linear-gradient(135deg,rgba(0,15,8,.85),rgba(0,10,5,.7));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);transition:all .25s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer}
.link-btn:active{transform:scale(.97);background:rgba(0,255,157,.12);border-color:var(--g)}
.link-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand,var(--g));box-shadow:0 0 14px var(--brand,var(--g))}
.link-btn .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);border:1.5px solid var(--brand,var(--g));box-shadow:0 0 16px var(--brand-bg,rgba(0,255,157,.35));position:relative;z-index:1}
.link-btn .ico svg{width:22px;height:22px;fill:var(--brand,var(--g));filter:drop-shadow(0 0 5px var(--brand,var(--g)))}
.link-btn .txt{flex:1;min-width:0;position:relative;z-index:1}
.link-btn .lbl{font-size:9.5px;letter-spacing:1.4px;color:#b8e0c8;margin-bottom:3px;text-transform:uppercase}
.link-btn .val{font-family:'Orbitron';font-weight:900;font-size:13px;color:var(--brand,var(--g));text-shadow:0 0 10px var(--brand,var(--g));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-btn .arrow{font-size:20px;color:var(--brand,var(--g));opacity:.7;position:relative;z-index:1;font-weight:700}
.detail-rows{display:flex;flex-direction:column;gap:10px}
.d-row{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;font-size:11px;background:linear-gradient(135deg,rgba(0,15,8,.75),rgba(0,10,5,.6));backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--g);box-shadow:0 6px 18px rgba(0,0,0,.3);align-items:center}
.d-row .k{color:#8fc8a8;font-weight:700;letter-spacing:1.2px;flex:0 0 auto;font-size:10px;text-transform:uppercase}
.d-row .v{color:var(--c);font-weight:700;text-align:right;word-break:break-all;font-size:11px;text-shadow:0 0 8px rgba(0,229,255,.4)}
.download-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:20px;border-radius:20px;border:1px solid rgba(255,255,255,.22);cursor:pointer;font-family:'Orbitron';font-weight:900;font-size:14px;letter-spacing:4px;color:#001a0e;background:linear-gradient(135deg,#00ff9d,#00c96b);box-shadow:0 16px 48px rgba(0,255,157,.5),inset 0 2px 0 rgba(255,255,255,.45);margin-top:10px;position:relative;overflow:hidden}
.download-btn::before{content:"";position:absolute;top:0;left:-100%;bottom:0;width:60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-25deg);animation:shine 3s infinite}
@keyframes shine{0%{left:-100%}60%{left:150%}100%{left:150%}}
.download-btn:active{transform:scale(.97)}
.download-btn svg{width:22px;height:22px;fill:#001a0e}
.watch-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:20px;border-radius:20px;border:none;cursor:pointer;font-family:'Orbitron';font-weight:900;font-size:14px;letter-spacing:4px;color:#fff;background:linear-gradient(135deg,#b06bff,#ff3b9e);box-shadow:0 16px 48px rgba(176,107,255,.5),inset 0 2px 0 rgba(255,255,255,.3);margin-top:10px;position:relative;overflow:hidden}
.watch-btn:active{transform:scale(.97)}
.watch-btn svg{width:22px;height:22px;fill:#fff}
.mini-footer{padding:10px 14px calc(10px + var(--safe-bottom));display:flex;gap:10px;background:linear-gradient(180deg,rgba(0,10,6,.35),rgba(0,15,8,.55));backdrop-filter:blur(28px);border-top:1px solid rgba(255,255,255,.06);flex:none}
.contact-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;border-radius:18px;cursor:pointer;border:1.5px solid rgba(0,255,157,.32);background:linear-gradient(135deg,rgba(0,35,18,.6),rgba(0,20,10,.5));backdrop-filter:blur(20px);color:var(--g);font-family:'Orbitron';font-weight:900;font-size:11px;letter-spacing:2.5px;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 24px rgba(0,255,157,.15);position:relative;overflow:hidden}
.contact-btn:active{transform:scale(.97);background:rgba(0,255,157,.18)}
.contact-btn svg{width:20px;height:20px;fill:var(--g);filter:drop-shadow(0 0 6px var(--g))}
.contact-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,5,2,.5);backdrop-filter:blur(14px);padding:20px}
.contact-modal.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.contact-card{width:100%;max-width:400px;border-radius:30px;background:linear-gradient(180deg,rgba(0,25,14,.75),rgba(0,12,6,.8));backdrop-filter:blur(36px);border:1.5px solid rgba(255,255,255,.16);box-shadow:0 30px 100px rgba(0,0,0,.7),0 0 60px rgba(0,255,157,.15);max-height:88vh;overflow:hidden;display:flex;flex-direction:column}
.contact-head{padding:32px 22px 20px;text-align:center;flex:none;background:linear-gradient(180deg,rgba(0,255,157,.05),transparent);border-bottom:1px solid rgba(255,255,255,.05);position:relative}
.contact-avatar{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 0deg,#00ff9d,#00e5ff,#b06bff,#ff3b9e,#00ff9d);padding:3px;animation:spin 10s linear infinite;box-shadow:0 0 40px rgba(0,255,157,.55)}
.contact-avatar-inner{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(0,20,12,.98),rgba(0,8,4,.98));display:grid;place-items:center;font-size:38px;animation:spin 10s linear infinite reverse;overflow:hidden;position:relative}
.contact-avatar-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover;animation:spin 10s linear infinite reverse;display:block}
.contact-head h3{font-family:'Orbitron';font-weight:900;font-size:15px;color:var(--g);text-shadow:0 0 18px var(--g),0 2px 4px #000;margin-bottom:6px}
.contact-head p{font-size:10px;color:#b8e0c8;letter-spacing:2px}
.contact-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,85,119,.4);background:rgba(255,85,119,.2);color:#ff8ba0;font-size:16px;cursor:pointer;display:grid;place-items:center;z-index:3;font-weight:700}
.contact-close:active{transform:scale(.9)}
.contact-links{padding:18px 22px 26px;display:flex;flex-direction:column;gap:11px;overflow-y:auto}
.contact-links a{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;text-decoration:none;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1.5px solid rgba(255,255,255,.1);position:relative;overflow:hidden;transition:all .25s;cursor:pointer}
.contact-links a:active{transform:scale(.97);background:rgba(255,255,255,.1);border-color:var(--brand,var(--g))}
.contact-links a::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand,var(--g));box-shadow:0 0 12px var(--brand,var(--g))}
.contact-links .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07);border:1.5px solid var(--brand,rgba(255,255,255,.15))}
.contact-links .ico svg{width:23px;height:23px;fill:var(--brand,var(--g))}
.contact-links .txt{flex:1;min-width:0}
.contact-links .lbl{font-size:9.5px;color:#b8e0c8;margin-bottom:3px;letter-spacing:1.2px;text-transform:uppercase}
.contact-links .val{font-family:'Orbitron';font-weight:900;font-size:13px;color:var(--brand,var(--g));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-links .arrow{font-size:20px;color:var(--brand,var(--g));opacity:.6}
#toast{position:fixed;top:calc(var(--safe-top) + 84px);left:50%;transform:translateX(-50%) translateY(-20px);background:linear-gradient(135deg,rgba(0,35,20,.95),rgba(0,20,12,.95));backdrop-filter:blur(28px);color:var(--g);padding:14px 24px;border-radius:16px;border:1.5px solid rgba(0,255,157,.4);font-size:12px;opacity:0;pointer-events:none;transition:all .4s;z-index:9999;white-space:nowrap;max-width:92vw;font-family:'Noto Sans Bengali',sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 32px rgba(0,255,157,.35);font-weight:700}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.upload-progress{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 32px;border-radius:24px;background:linear-gradient(180deg,rgba(0,35,20,.95),rgba(0,18,10,.95));backdrop-filter:blur(32px);border:1.5px solid rgba(0,255,157,.3);box-shadow:0 24px 80px rgba(0,0,0,.7);font-size:12px;color:var(--g);z-index:9998;display:none;text-align:center;min-width:220px;letter-spacing:1.5px;font-weight:700}
.upload-progress.show{display:block}
.up-spinner{width:36px;height:36px;margin:0 auto 12px;border:3px solid rgba(0,255,157,.18);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;box-shadow:0 0 24px rgba(0,255,157,.55)}
.video-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(20px)}
.video-modal.show{display:flex;animation:fadeIn .3s}
.video-container{width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:2px solid rgba(0,255,157,.4);box-shadow:0 0 80px rgba(0,255,157,.5);position:relative}
.video-container video,.video-container iframe{width:100%;height:100%;display:block;border:0;background:#000}
.video-close{position:absolute;top:calc(var(--safe-top) + 16px);right:16px;width:48px;height:48px;border-radius:50%;background:rgba(255,0,60,.35);border:2px solid rgba(255,60,90,.8);color:#fff;font-size:20px;font-weight:bold;cursor:pointer;display:grid;place-items:center;z-index:5;box-shadow:0 0 30px rgba(255,0,60,.8)}
.video-close:active{transform:scale(.9)}

.dl-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(16px);padding:20px}

.dl-title{font-family:'Orbitron';font-weight:900;font-size:13px;color:var(--g);letter-spacing:2px;text-shadow:0 0 12px var(--g);margin-bottom:6px}

.dl-bar-wrap{width:100%;height:10px;border-radius:99px;background:rgba(0,255,157,.12);overflow:hidden;margin-bottom:14px;position:relative}

@keyframes shim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.dl-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:'Share Tech Mono',monospace;font-size:10px}
.dl-stat{padding:10px 8px;border-radius:10px;background:rgba(0,255,157,.08);border:1px solid rgba(0,255,157,.25)}
.dl-stat small{display:block;color:#8fc8a8;font-size:8px;letter-spacing:1.5px;margin-bottom:4px;text-transform:uppercase}
.dl-stat b{color:var(--g);font-family:'Orbitron';font-weight:900;font-size:12px;text-shadow:0 0 8px var(--g)}
.dl-tip{margin-top:16px;padding:12px;border-radius:10px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.25);font-family:'Share Tech Mono',monospace;font-size:9.5px;color:#d8f0ff;line-height:1.6;text-align:left}
.dl-tip b{color:var(--c)}
.dl-cancel{margin-top:16px;width:100%;padding:12px;border-radius:12px;border:1.5px solid rgba(255,60,90,.5);background:rgba(255,60,90,.15);color:#ff8ba0;font-family:'Orbitron';font-weight:900;font-size:11px;letter-spacing:2px;cursor:pointer}
.dl-cancel:active{transform:scale(.97);background:rgba(255,60,90,.3)}
</style>
</head>
<body>

<div class="app">

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const USER_FILE  = 'github-user.txt';
const TOKEN_FILE = 'github-token.txt';
const CACHE_VER  = 'v12';

let GITHUB_USER  = '';
let GITHUB_TOKEN = '';
let TOKEN_MODE   = 'ANON';

/* ============================================================
   SETUP
   ============================================================ */
(function(){const l=document.getElementById('bgLayer');const n=['background.jpg','background.jpeg','background.png','background.webp','bg.jpg','bg.png'];let i=0;(function nx(){if(i>=n.length)return;const x=n[i++];const t=new Image();t.onload=()=>{l.style.backgroundImage=`url("${x}")`;};t.onerror=nx;t.src=x;})();})();
(function(){const b=document.getElementById('avatarBox');const n=['profile.jpg','profile.jpeg','profile.png','profile.webp','avatar.jpg','avatar.png','dp.jpg','dp.png'];let i=0;(function nx(){if(i>=n.length)return;const x=n[i++];const t=new Image();t.onload=()=>{b.innerHTML=`<img src="${x}" alt="">`;};t.onerror=nx;t.src=x;})();})();

function ensureAC(){try{return window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());}catch(e){return null;}}
function beep(f,d=0.06,v=0.08){const ac=ensureAC();if(!ac)return;if(ac.state==='suspended')ac.resume();try{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
window.addEventListener('load',()=>setTimeout(()=>beep(880,.1),200));
['click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{const ac=ensureAC();if(ac&&ac.state==='suspended')ac.resume();},{once:true,passive:true}));
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),3500);}
setInterval(()=>{document.getElementById('clk').textContent=new Date().toTimeString().slice(0,8);},1000);

(function(){const c=document.getElementById('matrix'),x=c.getContext('2d');let W,H,cols,drop;const ch='アイウエオカキクケコサシスセソタチツテト0123456789'.split('');function rs(){W=c.width=innerWidth;H=c.height=innerHeight;cols=Math.floor(W/16);drop=Array(cols).fill(0).map(()=>Math.random()*H)}rs();addEventListener('resize',rs);(function loop(){x.fillStyle='rgba(0,0,0,.1)';x.fillRect(0,0,W,H);for(let i=0;i<cols;i++){x.fillStyle=Math.random()>.85?'#00e5ff':'#00ff9d';x.font='14px monospace';x.shadowColor=x.fillStyle;x.shadowBlur=6;x.fillText(ch[Math.floor(Math.random()*ch.length)],i*16,drop[i]);drop[i]=drop[i]>H&&Math.random()>.975?0:drop[i]+16;}x.shadowBlur=0;requestAnimationFrame(loop);})();})();

/* ============================================================
   VIDEO PLAYER
   ============================================================ */
function extractYouTubeId(url){
  if(!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/.*[?&]v=([a-zA-Z0-9_-]{11})/
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m && m[1]) return m[1];
  }
  return null;
}
function playYouTube(videoId){
  if(!videoId) return;
  beep(880,.08);
  const modal = document.getElementById('videoModal');
  const container = document.getElementById('videoContainer');
  document.getElementById('videoLabel').textContent = '▶ YOUTUBE';
  container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&playsinline=1&modestbranding=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  modal.classList.add('show');
}
function playVideo(url, labelText){
  if(!url) return;
  beep(880,.08);
  const modal = document.getElementById('videoModal');
  const container = document.getElementById('videoContainer');
  document.getElementById('videoLabel').textContent = labelText || '▶ VIDEO';
  container.innerHTML = `<video src="${url}" controls autoplay playsinline webkit-playsinline preload="metadata"></video>`;
  modal.classList.add('show');
}
function closeVideo(){
  const modal = document.getElementById('videoModal');
  const container = document.getElementById('videoContainer');
  const v = container.querySelector('video');
  if(v){ try{ v.pause(); v.src=''; }catch(e){} }
  container.innerHTML = '';
  modal.classList.remove('show');
}
window.playYouTube = playYouTube;
window.playVideo = playVideo;
window.closeVideo = closeVideo;
document.getElementById('videoClose').addEventListener('click', closeVideo);
document.getElementById('videoModal').addEventListener('click', e=>{ if(e.target.id === 'videoModal') closeVideo(); });

/* ============================================================
   EXTERNAL LINK
   ============================================================ */
function openExternal(url){
  if(!url) return;
  beep(880,.05);
  try{ window.location.href = url; }catch(e){}
}
window.openExternal = openExternal;

/* ============================================================
   LINK EXTRACTION
   ============================================================ */
function isGithubUrl(u){
  const lo = (u||'').toLowerCase();
  return lo.includes('github.com') || lo.includes('github.io') || lo.includes('githubusercontent.com') || lo.includes('githubassets.com');
}
function extractLinks(text){
  if(!text)return[];
  const m=text.match(/https?:\/\/[^\s]+/g)||[];
  const seen=new Set(),res=[];
  for(let raw of m){
    let u=raw.replace(/[^\x20-\x7E]+$/g,'').replace(/[.,;:!?)\]]+$/,'');
    if(!u||u.length<8||seen.has(u))continue;
    if(isGithubUrl(u)) continue;
    seen.add(u);
    const lo=u.toLowerCase();
    let label='🔗 OPEN LINK',val=u.replace(/^https?:\/\//,'').slice(0,42),brand='#00ff9d',isYouTube=false;
    if(lo.includes('t.me/')||lo.includes('telegram.')){label='📢 TELEGRAM';brand='#2aabee';if(lo.includes('t.me/+')||lo.includes('joinchat'))val='JOIN CHANNEL';else val='@'+(u.split('/').pop()||'TELEGRAM');}
    else if(lo.includes('youtube.com')||lo.includes('youtu.be')){
      label='▶️ YOUTUBE';brand='#ff0055';isYouTube=true;
      const vid = extractYouTubeId(u);
      val = vid ? ('WATCH · '+vid) : (u.split('/').pop()||'WATCH');
    }
    else if(lo.includes('wa.me')||lo.includes('whatsapp.')){label='💬 WHATSAPP';brand='#25d366';val=u.split('/').pop()||'CHAT';}
    else if(lo.includes('facebook.com')||lo.includes('fb.com')||lo.includes('fb.me')){label='📘 FACEBOOK';brand='#5b9cf0';}
    else if(lo.includes('tiktok.com')){label='🎵 TIKTOK';brand='#ff0050';}
    else if(lo.includes('instagram.com')){label='📷 INSTAGRAM';brand='#e1306c';}
    res.push({url:u,label,val,brand,isYouTube});
  }
  return res;
}
function stripLinks(t){if(!t)return'';return t.replace(/https?:\/\/[^\s]+/g,'').replace(/\n{3,}/g,'\n\n').trim();}

/* ============================================================
   MAIN APP
   ============================================================ */
(function(){
  const $=id=>document.getElementById(id);
  const statDot=$('statDot'),statText=$('statText'),uploadProg=$('uploadProgress'),
        refreshBtn=$('refreshBtn'),appContainer=$('appContainer'),emptyState=$('emptyState'),
        detailView=$('detailView'),detailBody=$('detailBody'),detailTitle=$('detailTitle'),
        backBtn=$('backBtn'),contactBtn=$('contactBtn'),contactModal=$('contactModal'),
        contactClose=$('contactClose');

  let APPS={},IS_SYNCING=false,SYNC_TIMER=null,currentDetailId=null,FIRST_SYNC_DONE=false;
  let PROFILE=null,RATE_LIMIT_INFO=null;

  contactBtn.addEventListener('click',()=>{beep(880,.05);contactModal.classList.add('show');});
  contactClose.addEventListener('click',()=>contactModal.classList.remove('show'));
  contactModal.addEventListener('click',e=>{if(e.target===contactModal)contactModal.classList.remove('show');});

  function buildHeaders(accept){
    const h = {'Accept': accept || 'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    if(GITHUB_TOKEN && GITHUB_TOKEN.length > 20) h['Authorization'] = 'Bearer ' + GITHUB_TOKEN;
    return h;
  }

  async function ghApi(url, opts){
    opts = opts || {};
    try{
      const c=new AbortController();
      const t=setTimeout(()=>c.abort(),25000);
      const r=await fetch(url,{headers: buildHeaders(opts.accept),signal:c.signal,cache:'no-store',redirect: opts.redirect || 'follow'});
      clearTimeout(t);
      const remaining = r.headers.get('X-RateLimit-Remaining');
      const limit = r.headers.get('X-RateLimit-Limit');
      const reset = r.headers.get('X-RateLimit-Reset');
      if(remaining !== null){
        RATE_LIMIT_INFO = {remaining: parseInt(remaining),limit: parseInt(limit||'0'),reset: reset ? parseInt(reset)*1000 : 0};
      }
      if(r.status === 401 || r.status === 403){
        if(remaining === '0') return {__err:'RATE_LIMIT', reset: RATE_LIMIT_INFO.reset};
        if(r.status === 401) return {__err:'AUTH_FAILED'};
        return {__err:'FORBIDDEN', status:r.status};
      }
      if(r.status === 404) return null;
      if(!r.ok) return null;
      if(opts.binary) return await r.blob();
      return await r.json();
    }catch(e){ return {__err:'NETWORK', msg: e.message}; }
  }

  function cleanToken(txt){
    if(!txt) return '';
    txt = txt.replace(/^\uFEFF/, '');
    if(txt.includes('<html') || txt.includes('<!DOCTYPE') || txt.includes('<body') || txt.includes('<script') || txt.includes('<head')) return '';
    txt = txt.replace(/["'\r\n\t]/g,' ').trim();
    return txt.split(/\s+/)[0] || '';
  }
  async function fetchTextFetch(url){
    try{ const r = await fetch(url + '?t=' + Date.now(), {cache:'no-store'}); if(!r.ok) return null; return await r.text(); }catch(e){ return null; }
  }
  function fetchTextXHR(url){
    return new Promise(resolve=>{
      try{
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url + '?t=' + Date.now(), true);
        xhr.timeout = 5000;
        xhr.onreadystatechange = function(){
          if(xhr.readyState === 4){
            if(xhr.status === 200 || xhr.status === 0) resolve(xhr.responseText || null);
            else resolve(null);
          }
        };
        xhr.onerror = () => resolve(null);
        xhr.ontimeout = () => resolve(null);
        xhr.send();
      }catch(e){ resolve(null); }
    });
  }
  async function readAssetFile(baseName){
    const names = [baseName, baseName + 'i', baseName + ' ', ' ' + baseName, baseName + '.txt'];
    for(const name of names){
      let txt = await fetchTextFetch(name);
      if(txt && txt.length > 5){ const c = cleanToken(txt); if(c) return c; }
      txt = await fetchTextXHR(name);
      if(txt && txt.length > 5){ const c = cleanToken(txt); if(c) return c; }
    }
    return null;
  }
  async function loadConfig(){
    let savedUser = '';
    try{ savedUser = localStorage.getItem('dex_saved_user') || ''; }catch(e){}
    let fileUser = await readAssetFile(USER_FILE);
    if(!fileUser && !savedUser){
      const input = prompt('📛 Enter GitHub username:', 'DEX1HACKER-APK-sketch');
      if(input && input.trim()){ savedUser = input.trim().replace(/^@/,''); try{ localStorage.setItem('dex_saved_user', savedUser); }catch(e){} }
    }
    GITHUB_USER = savedUser || fileUser || 'DEX1HACKER-APK-sketch';
    if(fileUser && !savedUser){ try{ localStorage.setItem('dex_saved_user', fileUser); }catch(e){} }

    let savedToken = '';
    try{ savedToken = localStorage.getItem('dex_saved_token') || ''; }catch(e){}
    if(savedToken && savedToken.length > 20){ GITHUB_TOKEN = savedToken; TOKEN_MODE = 'PAT'; return; }
    let fileToken = await readAssetFile(TOKEN_FILE);
    if(fileToken && fileToken.length > 20){
      GITHUB_TOKEN = fileToken; TOKEN_MODE = 'PAT';
      try{ localStorage.setItem('dex_saved_token', fileToken); }catch(e){}
      return;
    }
    setTimeout(()=>{
      const input = prompt('🔑 GitHub Token দরকার\n\nএখন টোকেন paste করো (একবারই লাগবে):', '');
      if(input && input.trim()){
        const t = cleanToken(input);
        if(t && t.length > 20){
          GITHUB_TOKEN = t; TOKEN_MODE = 'PAT';
          try{ localStorage.setItem('dex_saved_token', t); }catch(e){}
          showToast('✅ টোকেন সেভ হয়েছে · reload হচ্ছে');
          setTimeout(()=>location.reload(), 800);
        }
      }
    }, 1500);
  }

  let tapCount = 0, tapTimer = null;
  const logoEl = document.getElementById('tbLogo');
  if(logoEl){
    logoEl.addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => tapCount = 0, 900);
      if(tapCount >= 5){
        tapCount = 0;
        const cur = (()=>{try{return localStorage.getItem('dex_saved_token')||'';}catch(e){return '';}})();
        const curMasked = cur ? cur.slice(0,15)+'...'+cur.slice(-6) : '(none)';
        const action = prompt('🔐 TOKEN MANAGER\n\nCurrent: ' + curMasked + '\n\nনতুন টোকেন paste করো:\n(Cancel = saved টোকেন মুছবে)', '');
        if(action && action.trim().length > 20){
          try{ localStorage.setItem('dex_saved_token', action.trim()); showToast('✅ টোকেন সেভ হয়েছে'); setTimeout(()=>location.reload(), 800); }
          catch(e){ showToast('❌ সেভ ব্যর্থ'); }
        } else if(action === null){
          try{ localStorage.removeItem('dex_saved_token'); showToast('🗑 টোকেন মুছে ফেলা হয়েছে'); setTimeout(()=>location.reload(), 800); }catch(e){}
        }
      }
    });
  }

  const LS_APPS=()=>'dex_gh_'+CACHE_VER+'_apps_'+GITHUB_USER;
  function loadLocal(){try{APPS=JSON.parse(localStorage.getItem(LS_APPS())||'{}');}catch(e){APPS={};}}
  function saveLocal(){try{localStorage.setItem(LS_APPS(),JSON.stringify(APPS));}catch(e){}}

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmtSize(b){if(!b||typeof b!=='number')return'';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(2)+' MB';return(b/1073741824).toFixed(2)+' GB';}
  function apkSVG(){return`<svg viewBox="0 0 24 24"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24c-1.4-.62-3.09-1-4.87-1s-3.47.38-4.87 1L4.85 5.67c-.19-.29-.58-.38-.87-.2-.28.18-.37.54-.22.83L5.6 9.48C2.61 11.07.34 13.74 0 17h24c-.34-3.26-2.61-5.93-5.6-7.52M7 15c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1m10 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>`;}
  function getIco(fn,m){fn=(fn||'').toLowerCase();if(fn.endsWith('.apk')||fn.endsWith('.xapk')||fn.endsWith('.aab'))return{type:'apk'};if(fn.endsWith('.zip')||fn.endsWith('.rar'))return{type:'emoji',emoji:'🗜️'};if(fn.endsWith('.pdf'))return{type:'emoji',emoji:'📕'};if(fn.endsWith('.mp3'))return{type:'emoji',emoji:'🎵'};if(fn.endsWith('.mp4'))return{type:'emoji',emoji:'🎬'};if(fn.endsWith('.jpg')||fn.endsWith('.png'))return{type:'emoji',emoji:'🖼️'};return{type:'emoji',emoji:'📄'};}
  function safeName(a){if(!a)return'Unknown';if(a.custom_name&&String(a.custom_name).trim())return String(a.custom_name);if(a.file_name&&typeof a.file_name==='string'&&a.file_name.trim())return a.file_name.replace(/\.[^.]+$/,'');return'Unknown';}

  function buildFile({owner,repo,release,asset,iconUrl,videoUrl,source,path}){
    const body = release ? (release.body||'') : '';
    const links = extractLinks(body).map(l=>l.url);
    const cleanBody = stripLinks(body);
    const fileId = `gh_${owner}_${repo}_${asset.id||asset.sha||asset.name}`;
    return {
      file_id: fileId,message_id: fileId,file_name: asset.name,file_size: asset.size||0,mime_type: asset.content_type||'',
      date: release ? Math.floor(new Date(release.published_at).getTime()/1000) : Math.floor(Date.now()/1000),
      caption: cleanBody,links: links,
      custom_name: release && release.name ? release.name : null,
      version: release && release.tag_name ? release.tag_name.replace(/^v/i,'') : null,
      icon_url: iconUrl || null,icon_data: null,
      video_url: videoUrl || null,
      download_url: asset.browser_download_url || asset.download_url || '',
      html_url: release ? release.html_url : asset.html_url || '',
      repo: repo,owner: owner,source: source || 'Release',path: path || '',
      _remote: true
    };
  }

  async function scanSingleRepo(repo){
    const branch = repo.default_branch || 'main';
    const files = [];
    let repoFound = 0;
    const [rels, treeData] = await Promise.all([
      ghApi(`https://api.github.com/repos/${repo.owner.login}/${repo.name}/releases?per_page=100`),
      ghApi(`https://api.github.com/repos/${repo.owner.login}/${repo.name}/git/trees/${encodeURIComponent(branch)}?recursive=1`)
    ]);
    if(Array.isArray(rels)){
      for(const rel of rels){
        let iconUrl = null, videoUrl = null;
        const assets = rel.assets||[];
        for(const a of assets){
          if(isImageAsset(a.name) && !iconUrl) iconUrl = a.browser_download_url;
          if(isVideoAsset(a.name) && !videoUrl) videoUrl = a.browser_download_url;
        }
        for(const a of assets){
          if(isSupportedAsset(a.name)){
            files.push(buildFile({owner: repo.owner.login, repo: repo.name, release: rel,asset: a, iconUrl, videoUrl, source: 'Release', path: 'Release Asset'}));
            repoFound++;
          }
        }
      }
    }
    if(treeData && Array.isArray(treeData.tree)){
      let rootIcon = null, rootVideo = null;
      for(const item of treeData.tree){
        if(item.type !== 'blob') continue;
        const fname = item.path.split('/').pop();
        const encodedPath = item.path.split('/').map(encodeURIComponent).join('/');
        const rawUrl = `https://raw.githubusercontent.com/${repo.owner.login}/${repo.name}/${branch}/${encodedPath}`;
        if(isImageAsset(fname) && !rootIcon) rootIcon = rawUrl;
        if(isVideoAsset(fname) && !rootVideo) rootVideo = rawUrl;
      }
      for(const item of treeData.tree){
        if(item.type !== 'blob') continue;
        const fname = item.path.split('/').pop();
        if(!isSupportedAsset(fname)) continue;
        const encodedPath = item.path.split('/').map(encodeURIComponent).join('/');
        const rawUrl = `https://raw.githubusercontent.com/${repo.owner.login}/${repo.name}/${branch}/${encodedPath}`;
        const htmlUrl = `https://github.com/${repo.owner.login}/${repo.name}/blob/${branch}/${encodedPath}`;
        files.push(buildFile({
          owner: repo.owner.login, repo: repo.name, release: null,
          asset: {id: item.sha, name: fname, size: item.size || 0,download_url: rawUrl, browser_download_url: rawUrl, html_url: htmlUrl,content_type: 'application/vnd.android.package-archive'},
          iconUrl: rootIcon, videoUrl: rootVideo,
          source: item.path.includes('/') ? 'Folder' : 'Repo', path: item.path
        }));
        repoFound++;
      }
    }
    return { files, count: repoFound, name: repo.name };
  }

  async function fetchAllFromGitHub(){
    const profile = await ghApi(`https://api.github.com/users/${encodeURIComponent(GITHUB_USER)}`);
    if(profile && profile.__err === 'RATE_LIMIT') return {__err:'RATE_LIMIT'};
    if(profile && profile.__err === 'AUTH_FAILED') return {__err:'AUTH_FAILED'};
    if(!profile || !profile.login) return {__err:'NOT_FOUND'};
    PROFILE = profile;
    const repos = await ghApi(`https://api.github.com/users/${encodeURIComponent(GITHUB_USER)}/repos?type=owner&per_page=100&sort=updated`);
    if(repos && repos.__err === 'RATE_LIMIT') return {__err:'RATE_LIMIT'};
    if(!Array.isArray(repos)) return {__err:'NO_REPOS'};
    const activeRepos = repos.filter(r=>!r.archived);
    const files = [];
    const repoSummary = [];
    const BATCH = 5;
    let done = 0;
    for(let i = 0; i < activeRepos.length; i += BATCH){
      const batch = activeRepos.slice(i, i + BATCH);
      statText.innerHTML = `SCANNING ${done+1}-${Math.min(done+BATCH, activeRepos.length)}/${activeRepos.length}…`;
      const results = await Promise.all(batch.map(r => scanSingleRepo(r).catch(e => ({files:[], count:0, name:r.name}))));
      for(const res of results){
        files.push(...res.files);
        repoSummary.push({ name: res.name, count: res.count });
        done++;
      }
    }
    console.log('📊 SCAN SUMMARY:', repoSummary);
    return { files, profile, repoSummary };
  }

  function fmtRateLimit(){
    if(!RATE_LIMIT_INFO) return '';
    const {remaining, limit} = RATE_LIMIT_INFO;
    if(remaining <= 5){
      const resetIn = RATE_LIMIT_INFO.reset ? Math.max(0, Math.round((RATE_LIMIT_INFO.reset - Date.now())/60000)) : 0;
      return ` ⚠ ${remaining}/${limit} · ${resetIn}m`;
    }
    return ` · ${remaining}/${limit}`;
  }
  function cleanLinks(links){ if(!Array.isArray(links)) return []; return links.filter(u => u && typeof u === 'string' && !isGithubUrl(u)); }

  async function syncAll(silent){
    if(IS_SYNCING)return;
    IS_SYNCING=true;
    let changed=false;
    try{
      const res = await fetchAllFromGitHub();
      if(res.__err === 'RATE_LIMIT'){
        statDot.classList.remove('on');
        statText.textContent = TOKEN_MODE === 'ANON' ? 'RATE LIMIT (anonymous)' : 'RATE LIMIT';
        if(!silent) showToast(TOKEN_MODE === 'ANON' ? '⚠️ Anonymous limit — logo tap 5x = token' : '⚠️ Rate limit');
        IS_SYNCING=false; return;
      }
      if(res.__err === 'AUTH_FAILED'){
        statDot.classList.remove('on');
        statText.textContent = 'TOKEN INVALID';
        if(!silent) showToast('❌ টোকেন ভুল — logo tap 5x = reset');
        IS_SYNCING=false; return;
      }
      if(res.__err){ statDot.classList.remove('on'); statText.textContent = res.__err; IS_SYNCING=false; return; }
      const existing = APPS;
      const merged = {};
      for(const f of res.files){
        const old = existing[f.file_id];
        if(old){
          const oldLinks = cleanLinks(old.links);
          merged[f.file_id] = Object.assign({}, f, {
            custom_name: old.custom_name || f.custom_name,
            version: old.version || f.version,
            caption: old.caption || f.caption,
            links: oldLinks.length ? oldLinks : cleanLinks(f.links),
            icon_data: old.icon_data || null
          });
        } else merged[f.file_id] = Object.assign({}, f, { links: cleanLinks(f.links) });
      }
      if(Object.keys(APPS).length !== Object.keys(merged).length) changed = true;
      APPS = merged;
      saveLocal();
      FIRST_SYNC_DONE = true;
      statDot.classList.add('on');
      const modeTag = TOKEN_MODE === 'PAT' ? '⚡' : '🔓';
      const rateInfo = fmtRateLimit();
      statText.innerHTML = `${modeTag} ${TOKEN_MODE} · <b>@${esc(res.profile.login)}</b>${rateInfo}`;
      updateContactProfile(res.profile);
      if(changed || !silent) renderHome();
      if(!silent) showToast(`✅ ${TOKEN_MODE} · ${Object.keys(APPS).length} files`);
    }catch(e){ console.warn(e); }
    IS_SYNCING=false;
  }

    if(label.includes('TIKTOK'))return'<svg viewBox="0 0 24 24"><path d="M19.6 6.7c-1.5-.9-2.6-2.4-2.7-4.2h-3.6v13.5c0 2-1.6 3.7-3.7 3.7-2 0-3.7-1.6-3.7-3.7s1.6-3.7 3.7-3.7c.4 0 .8 0 1.1.1V8.7c-.4 0-.7-.1-1.1-.1C6.1 8.6 3 11.7 3 15.6s3.1 7 7 7 7-3.1 7-7v-6.9c1.3.9 2.8 1.4 4.5 1.4V6.6c-.7 0-1.3-.1-1.9-.4z"/></svg>';
    if(label.includes('INSTAGRAM'))return'<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm5 5a5 5 0 100 10 5 5 0 000-10zm6-1a1 1 0 100 2 1 1 0 000-2z"/></svg>';
    return'<svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>';
  }

  function renderDetail(docId){
    try{
      const a=APPS[docId];if(!a){closeDetail();return;}
      currentDetailId=docId;
      const dName=safeName(a);
      detailTitle.textContent=dName.toUpperCase().slice(0,32);
      const ic=getIco(a.file_name,a.mime_type);
      let icHTML;
      if(hasIcon(a)) icHTML = '<img alt="">';
      else if(ic.type==='apk') icHTML = '<div class="apk-ico">'+apkSVG()+'</div>';
      else icHTML = '<div class="emoji-ico">'+ic.emoji+'</div>';
      const date=a.date?new Date(a.date*1000).toLocaleString():'—';
      const cleanLinksArr = cleanLinks(a.links);
      const linkList = cleanLinksArr.map(url=>{ const arr=extractLinks(url); return arr[0]||null; }).filter(Boolean);
      let linksHTML='';
      if(linkList.length){
        linksHTML='<div class="link-btns">'+linkList.map(l=>{
          const bg=l.brand==='#ffffff'?'rgba(255,255,255,.15)':'rgba(0,0,0,.2)';
          const safeUrl = esc(l.url).replace(/'/g,"\\'");
          if(l.isYouTube){
            const vid = extractYouTubeId(l.url);
            if(vid){
              return `<a class="link-btn" href="#" onclick="event.preventDefault();event.stopPropagation();playYouTube('${vid}');return false;" style="--brand:${l.brand};--brand-bg:${bg}"><div class="ico">${linkIconSVG(l.label)}</div><div class="txt"><div class="lbl">${esc(l.label)}</div><div class="val">${esc(l.val)}</div></div><div class="arrow">›</div></a>`;
            }
          }
          return `<a class="link-btn" href="${esc(l.url)}" onclick="event.preventDefault();event.stopPropagation();openExternal('${safeUrl}');return false;" style="--brand:${l.brand};--brand-bg:${bg}"><div class="ico">${linkIconSVG(l.label)}</div><div class="txt"><div class="lbl">${esc(l.label)}</div><div class="val">${esc(l.val)}</div></div><div class="arrow">›</div></a>`;
        }).join('')+'</div>';
      }
      const videoBtnHTML = a.video_url
        ? `<button class="watch-btn" onclick="playVideo('${esc(a.video_url).replace(/'/g,"\\'")}','▶ WATCH VIDEO')"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>WATCH VIDEO</button>`
        : '';
      detailBody.innerHTML=`
        <div class="detail-hero">
          <div class="detail-icon-wrap">${icHTML}</div>
          <div class="detail-name">${esc(dName)}</div>
          ${a.version?`<div class="detail-vbadge">v${esc(a.version)}</div>`:''}
        </div>
        ${a.caption?`<div class="detail-desc"><span class="lbl">💬 DESCRIPTION</span>${esc(a.caption)}</div>`:''}
        ${linksHTML}
        <div class="detail-rows">
          <div class="d-row"><span class="k">📄 FILE</span><span class="v">${esc(a.file_name)}</span></div>
          <div class="d-row"><span class="k">📦 SIZE</span><span class="v">${fmtSize(a.file_size)||'?'}</span></div>
          <div class="d-row"><span class="k">📁 REPO</span><span class="v">${esc(a.repo)}</span></div>
          ${a.path?`<div class="d-row"><span class="k">📂 PATH</span><span class="v">${esc(a.path)}</span></div>`:''}
          <div class="d-row"><span class="k">📅 DATE</span><span class="v">${date}</span></div>
        </div>
        <button class="download-btn" id="dlBtn"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>DOWNLOAD</button>
        ${videoBtnHTML}
      `;
      if(hasIcon(a)){
        const img = detailBody.querySelector('.detail-icon-wrap img');
        if(img){
          img.addEventListener('error', function(){ this.parentNode.innerHTML = '<div class="emoji-ico">📄</div>'; });
          img.src = iconSrc(a);
        }
      }
      $('dlBtn').addEventListener('click',()=>downloadFile(docId));
      detailView.classList.add('show');detailView.scrollTop=0;
    }catch(err){console.warn(err);}
  }

  function closeDetail(){detailView.classList.remove('show');currentDetailId=null;}
  backBtn.addEventListener('click',closeDetail);
  appContainer.addEventListener('click',e=>{const el=e.target.closest('.app-icon');if(!el)return;const id=el.dataset.docId;if(id&&APPS[id]){beep(880,.05);renderDetail(id);}});

  function showProg(t){uploadProg.innerHTML=`<div class="up-spinner"></div>${t}`;uploadProg.classList.add('show');}
  function hideProg(){uploadProg.classList.remove('show');}

  /* ============================================================
     ⭐⭐⭐ DOWNLOAD + OPEN DOWNLOADS FOLDER ⭐⭐⭐
     ============================================================ */
  const dlOverlay = document.getElementById('dlOverlay');
  const dlBar = document.getElementById('dlBar');
  const dlPct = document.getElementById('dlPct');
  const dlRecv = document.getElementById('dlRecv');
  const dlTotal = document.getElementById('dlTotal');
  const dlSpeed = document.getElementById('dlSpeed');
  const dlName = document.getElementById('dlName');
  const dlCancelBtn = document.getElementById('dlCancel');
  let _dlCancelled = false;

  function showDlOverlay(filename){
    _dlCancelled = false;
    dlName.textContent = filename;
    dlPct.innerHTML = '0<small>%</small>';
    dlBar.style.width = '0%';
    dlRecv.textContent = '0 MB';
    dlTotal.textContent = '?';
    dlSpeed.textContent = '0 MB/s';
    dlOverlay.classList.add('show');
  }
  function hideDlOverlay(){ dlOverlay.classList.remove('show'); }
  function updateDlProgress(pct, recvBytes, totalBytes, speed){
    dlBar.style.width = Math.min(100, pct) + '%';
    dlPct.innerHTML = Math.floor(pct) + '<small>%</small>';
    dlRecv.textContent = (recvBytes/1048576).toFixed(2) + ' MB';
    dlTotal.textContent = totalBytes ? (totalBytes/1048576).toFixed(2) + ' MB' : '?';
    dlSpeed.textContent = (speed/1048576).toFixed(2) + ' MB/s';
  }
  dlCancelBtn.addEventListener('click', () => {
    _dlCancelled = true;
    hideDlOverlay();
    showToast('❌ ডাউনলোড বাতিল');
  });

  // ⭐ Native download via hidden iframe
  function triggerNativeDownload(url){
    try{
      const f = document.createElement('iframe');
      f.style.cssText = 'display:none;position:absolute;width:0;height:0;border:0;visibility:hidden;';
      f.setAttribute('referrerpolicy','no-referrer');
      document.body.appendChild(f);
      setTimeout(() => { try{ f.src = url; }catch(e){} }, 100);
      setTimeout(() => { try{ if(f.parentNode) f.parentNode.removeChild(f); }catch(e){} }, 120000);
      return true;
    }catch(e){ return false; }
  }

  // ⭐ Open Downloads folder — user taps the APK to install
  function openDownloadsFolder(){
    const intents = [
      // Best: Open Downloads app
      'intent:#Intent;action=android.intent.action.VIEW_DOWNLOADS;end',
      // Alt: Open files app for downloads
      'intent:#Intent;action=android.intent.action.VIEW_DOWNLOADS;type=vnd.android.document/directory;end',
    ];
    for(const url of intents){
      try{
        const a = document.createElement('a');
        a.href = url;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { try{ a.remove(); }catch(e){} }, 1200);
        return true;
      }catch(e){}
    }
    return false;
  }

  async function downloadFile(fileId){
    const app = APPS[fileId];
    if(!app || !app.download_url){ showToast('❌ Download URL নেই'); return; }
    const url = app.download_url;
    const fn = app.file_name || 'file.apk';
    const fileSize = app.file_size || 0;

    beep(880,.08);

    if(!/^https?:\/\//i.test(url)){
      showToast('❌ Invalid download URL');
      return;
    }

    // 1) Fire native download
    const nativeOK = triggerNativeDownload(url);
    if(!nativeOK){
      showToast('❌ ডাউনলোড শুরু করা যায়নি');
      return;
    }

    // 2) Show progress
    showDlOverlay(fn);

    const startTime = Date.now();
    let estSec = 5;
    if(fileSize > 0){
      estSec = fileSize / 2621440;
      estSec = Math.max(4, Math.min(45, estSec));
    }

    return new Promise(resolve => {
      const tick = setInterval(() => {
        if(_dlCancelled){
          clearInterval(tick);
          resolve();
          return;
        }
        const elapsed = (Date.now() - startTime) / 1000;
        const ratio = Math.min(elapsed / estSec, 1);
        const eased = ratio < 1 ? (1 - Math.pow(1 - ratio, 2.2)) : 1;
        const pct = Math.min(eased * 100, 99);
        const recvBytes = fileSize ? fileSize * (pct/100) : 0;
        const speed = elapsed > 0 ? (recvBytes / elapsed) : 0;
        updateDlProgress(pct, recvBytes, fileSize, speed);

        if(ratio >= 1){
          clearInterval(tick);
          updateDlProgress(100, fileSize, fileSize, speed);
          beep(1320,.15);

          setTimeout(() => {
            if(_dlCancelled){ resolve(); return; }
            hideDlOverlay();
            showToast('✅ ডাউনলোড সম্পন্ন! Downloads খুলছে...');
            setTimeout(() => {
              openDownloadsFolder();
            }, 600);
            resolve();
          }, 900);
        }
      }, 200);
    });
  }

  refreshBtn.addEventListener('click',async()=>{
    refreshBtn.classList.add('spin');
    await syncAll(false);
    renderHome();
    setTimeout(()=>refreshBtn.classList.remove('spin'),600);
  });

  async function boot(){
    statText.textContent = 'LOADING CONFIG…';
    await loadConfig();
    statText.textContent = TOKEN_MODE === 'PAT' 
      ? `⚡ PAT · @${GITHUB_USER.toUpperCase()}`
      : `🔓 ANON · @${GITHUB_USER.toUpperCase()}`;
    loadLocal();
    if(Object.keys(APPS).length) renderHome();
    await syncAll(true);
    if(SYNC_TIMER)clearInterval(SYNC_TIMER);
    SYNC_TIMER=setInterval(()=>syncAll(true),180000);
    if(TOKEN_MODE === 'ANON'){
      showToast('⚠️ ANON mode · logo tap 5x → token দিন');
    } else {
      showToast('⚡ PAT mode · '+Object.keys(APPS).length+' files');
    }
    beep(1320,.12);
  }
  boot();
})();
</script>
